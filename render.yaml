services:
  - type: web
    name: apicalypse-voice-rag
    runtime: docker
    dockerfilePath: ./hhg-task2/Dockerfile
    dockerContext: ./hhg-task2
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: ANSWER_MODE
        value: fast
      - key: VECTOR_STORE_TYPE
        value: local
      - key: RETRIEVAL_NAMESPACE
        value: fixed
      - key: RETRIEVAL_TOP_K
        value: "5"
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: OFF_TOPIC_THRESHOLD
        value: "0.10"
      - key: GROUNDING_THRESHOLD
        value: "0.58"
      - key: GROUNDING_THRESHOLD_GU
        value: "0.40"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: MKL_NUM_THREADS
        value: "2"
      - key: TORCH_NUM_THREADS
        value: "2"
      - key: MAX_LATENCY_MS
        value: "200"
      - key: LOG_LEVEL
        value: INFO
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
